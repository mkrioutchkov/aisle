<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1315" media="(prefers-color-scheme: dark)">
<title>Find it in store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="store">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
    <span id="storeName">Anaconda</span>
  </div>
  <button id="speak" class="icon-btn" type="button" aria-pressed="true" aria-label="Read answers aloud">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  </button>
</header>

<main id="feed" aria-live="polite">
  <section id="welcome" class="welcome">
    <h1>What are you after?</h1>
    <p>Ask by voice or type. Aisle, bay and stock in seconds.</p>
    <button id="bigMic" class="big-mic" type="button" aria-label="Tap and speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
    </button>
    <p class="hint" id="hint">Tap and speak</p>
    <div class="chips" id="chips"></div>
  </section>
</main>

<form id="composer" class="composer" autocomplete="off">
  <div class="bar">
    <input id="q" type="search" enterkeyhint="search" placeholder="e.g. tent pegs" aria-label="What are you looking for?">
    <button id="mic" class="mic" type="button" aria-label="Speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
    </button>
    <button class="send" type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</form>

<script src="config.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
